  "test/core/jtd/*.c",
  "test/core/lock/*.c",
  "test/core/manifest/gen/gen.c",
  "test/core/manifest/lower/lower.c",
  "test/core/options/*.c",
  "test/core/pkg/*.c",
  "test/core/profile/profile.c",
  "test/core/publish/publish.c",
  "test/core/reflect/*.c",
  "test/core/schema/schema.c",
  "test/core/toml/*.c",
  "test/core/thread_pool/*.c",
  "test/core/zig/*.c",
  "tools/jtd.c",
  "tools/gen/lower.c",
  "tools/install/render.c",
  "source/cli/install/plan.c",
  "test/core/tools/ctx.c",
  "test/core/tools/elf_emit.c",
  "test/core/tools/wasm_emit.c",
  "test/tools/fixture.c",
  "test/tools/path_roots.c",
  "test/tools/sim/sim.c",
  "test/core/tools/main/unit.c",
]
include = ["include", "source/core", "source/util", "source/core/external", "source/cli", "test/core", "test/core/tools", "test/tools", "tools", "tools/gen", "tools/install", { path = "gen/codegen/gen", tree = "work" }]
deps = ["spn"]
embed = [
  { path = "gen/codegen/gen/config.jtd.json", tree = "work", dest = "schema/config.jtd.json" },
  { path = "gen/codegen/gen/manifest.jtd.json", tree = "work", dest = "schema/manifest.jtd.json" },
  { path = "gen/codegen/gen/release.jtd.json", tree = "work", dest = "schema/release.jtd.json" },
]
flags = [
  '-DSCHEMA_DIR="source/core/codegen/schema"',
  '-DJTD_TEST_JSON_DIR="test/core/jtd/json"',
  '-DMANIFEST_DIR="test/core/manifest/lower/manifests"',
  '-DPKG_MANIFEST_DIR="test/core/pkg/manifests"',
  '-DCONFIG_DIR="test/core/config/configs"',
  '-DTOOLCHAINS_DIR="test/core/toolchain/toolchains"',
]

