[package]
name = "spn"
version = "0.7.0"
repo = "boonbane/spn"
include = ["include", { path = "gen/include", tree = "work" }]
system_deps = [
  # spn self install reads and writes HKCU\Environment and broadcasts
  # WM_SETTINGCHANGE. these sit on the package, not the bin, because stage0 is
  # 0.4.3 and only applies package system deps
  { lib = "advapi32", when = { os = "windows" } },
  { lib = "user32", when = { os = "windows" } },
]

[package.configure]
source = ["tools/spn/configure.c"]
include = ["include"]

[package.build]
source = [
  "tools/spn/build.c",
  "tools/spn/wasi.c",
  "tools/jtd.c",
  "tools/gen/lower.c",
  "tools/gen/bind.c",
  "tools/gen/union.c",
  "tools/gen/abi.c",
  "tools/gen/data.c",
  "tools/gen/run.c",
]
include = ["include", "source/core", "source/util", "tools", "tools/gen"]

[deps.package]
sp = { path = "vendor/sp" }
wamr = { path = "vendor/wamr" }
toml = { path = "vendor/toml" }
yyjson = { path = "vendor/yyjson"}
blake3 = { path = "vendor/blake3"}

[deps.build]
sp = { path = "vendor/sp" }
yyjson = { path = "vendor/yyjson"}

[patch.wamr]
files = [
  "tools/patches/wamr-wasi-hook.patch",
  "tools/patches/wamr-darwin-timeb.patch",
  "tools/patches/wamr-win-readdir.patch",
  "tools/patches/wamr-sanitize.patch",
  "tools/patches/wamr-musl-stack.patch",
  "tools/patches/wamr-mingw-tls.patch",
  "tools/patches/wamr-win-warnings.patch",
  "tools/patches/wamr-win-overlapped.patch",
]

[profile.default]
toolchain = "zig"
linkage = "static"
standard = "c11"
mode = "debug"

[profile.musl]
toolchain = "zig"
abi = "musl"

[profile.gnu]
toolchain = "zig"
abi = "gnu"
linkage = "shared"

[profile.mingw]
toolchain = "zig"
os = "windows"
abi = "gnu"

[profile.msvc]
toolchain = "msvc"
abi = "msvc"

[profile.sanitizer]
toolchain = "clang"
linkage = "shared"
sanitize = ["address", "undefined"]

[[lib]]
name = "spn"
kinds = ["static"]
source = [
  "source/core/**/*.c",
  "source/util/**/*.c",
  { path = "gen/codegen/gen/abi.gen.c", tree = "work" },
  { path = "gen/codegen/gen/config.gen.c", tree = "work" },
  { path = "gen/codegen/gen/errors.gen.c", tree = "work" },
  { path = "gen/codegen/gen/events.gen.c", tree = "work" },
  { path = "gen/codegen/gen/manifest.gen.c", tree = "work" },
  { path = "gen/codegen/gen/release.gen.c", tree = "work" },
  { path = "gen/codegen/gen/source_deps.gen.c", tree = "work" },
]
include = ["include", "source/core", "source/util", "source/core/external", { path = "gen/codegen/gen", tree = "work" }]
embed = [
  { path = "include/spn.h", data_type = "u8", size_type = "u64" },
  { path = "include/spn/core.h", data_type = "u8", size_type = "u64" },
  { path = "gen/include/spn/err.h", tree = "work", dest = "include/spn/err.h", data_type = "u8", size_type = "u64" },
  { path = "source/core/toolchain/toolchains.toml", dest = "toolchains.toml", data_type = "u8", size_type = "u64" },
  { path = "assets/zig/stub.c", dest = "zig/stub.c", data_type = "u8", size_type = "u64" },
  { path = "assets/init", dir = true, dest = "init", data_type = "u8", size_type = "u64" },
]

[[bin]]
name = "spn"
source = ["source/cli/**/*.c"]
include = ["include", "source/cli", "source/util"] # @spader removed the core include
deps = ["spn"]
flags = []
embed = [{ path = "docs/content", dir = true, dest = "docs" }]

[[script]]
name = "installer"
source = ["tools/install/main.c", "tools/install/render.c"]
include = ["tools/install"]

[[script]]
name = "docs"
source = ["tools/gen/docs.c", "tools/jtd.c"]
include = ["tools"]

[[script]]
name = "smoke"
source = [
  "tools/docker/source/main.c",
  "tools/docker/source/docker/docker.c",
  "tools/docker/source/tail/tail.c",
  "tools/docker/source/variant/variant.c",
  "test/tools/lanes.c",
]
include = ["include", "source/core", "source/util", "test/tools", "tools/docker/source", { path = "gen/codegen/gen", tree = "work" }]
deps = ["spn"]

[[script]]
name = "winvm"
source = [
  "tools/windows/source/main.c",
  "tools/windows/source/winvm/winvm.c",
  "tools/windows/source/variant/variant.c",
  "tools/docker/source/tail/tail.c",
  { path = "gen/codegen/test/probe.gen.c", tree = "work" },
]
include = ["include", "source/core", "source/util", "tools/windows/source", "tools/docker/source", { path = "gen/codegen/gen", tree = "work" }, { path = "gen/codegen/test", tree = "work" }]
deps = ["spn"]

[[script]]
name = "smoke-shell"
source = ["tools/docker/source/container/shell.c"]
include = ["tools/docker/source"]

[[script]]
name = "smoke-check"
source = ["tools/docker/source/container/check.c"]
include = ["tools/docker/source"]

