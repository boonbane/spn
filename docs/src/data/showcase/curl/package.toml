[package]
name = "curl"
version = "8.19.0"
author = "curl"
maintainer = "tspader"
include = ["include"]
define = [
  "USE_IPV6",
  "CURL_DISABLE_LDAP",
  "CURL_DISABLE_LDAPS",
  { value = "USE_UNIX_SOCKETS", when = { os = { not = "windows" } } },
  { value = "USE_THREADS_POSIX", when = { os = { not = "windows" } } },
  { value = "USE_WINDOWS_SSPI", when = { os = "windows" } },
  { value = "USE_SCHANNEL", when = { os = "windows", tls = true } },
  { value = "USE_MBEDTLS", when = { os = { not = "windows" }, tls = true } },
  { value = "HAVE_MBEDTLS_DES_CRYPT_ECB", when = { os = { not = "windows" }, tls = true } },
  { value = "USE_WIN32_IDN", when = { os = "windows", idn = true } },
  { value = "USE_APPLE_IDN", when = { os = "macos", idn = true } },
  { value = "CURL_DISABLE_FTP", when = { ftp = false } },
  { value = "CURL_DISABLE_FILE", when = { file = false } },
  { value = "CURL_DISABLE_DICT", when = { dict = false } },
  { value = "CURL_DISABLE_GOPHER", when = { gopher = false } },
  { value = "CURL_DISABLE_IMAP", when = { imap = false } },
  { value = "CURL_DISABLE_POP3", when = { pop3 = false } },
  { value = "CURL_DISABLE_SMTP", when = { smtp = false } },
  { value = "CURL_DISABLE_TELNET", when = { telnet = false } },
  { value = "CURL_DISABLE_TFTP", when = { tftp = false } },
  { value = "CURL_DISABLE_MQTT", when = { mqtt = false } },
  { value = "CURL_DISABLE_RTSP", when = { rtsp = false } },
  { value = "CURL_DISABLE_SMB", when = { smb = false } },
  { value = "CURL_DISABLE_IPFS", when = { ipfs = false } },
  { value = "CURL_DISABLE_WEBSOCKETS", when = { websockets = false } },
  { value = "CURL_DISABLE_PROXY", when = { proxy = false } },
  { value = "CURL_DISABLE_COOKIES", when = { cookies = false } },
  { value = "CURL_DISABLE_DOH", when = { doh = false } },
  { value = "CURL_DISABLE_HSTS", when = { hsts = false } },
  { value = "CURL_DISABLE_HSTS", when = { hsts = true, tls = false } },
  { value = "CURL_DISABLE_ALTSVC", when = { altsvc = false } },
  { value = "CURL_DISABLE_NETRC", when = { netrc = false } },
  { value = "CURL_DISABLE_MIME", when = { mime = false } },
  { value = "CURL_DISABLE_FORM_API", when = { mime = false } },
  { value = "CURL_DISABLE_VERBOSE_STRINGS", when = { verbose_strings = false } },
]
system_deps = [
  { lib = "pthread", when = { os = "linux" } },
  { lib = "ws2_32", when = { os = "windows" } },
  { lib = "iphlpapi", when = { os = "windows" } },
  { lib = "bcrypt", when = { os = "windows" } },
  { lib = "advapi32", when = { os = "windows" } },
  { lib = "crypt32", when = { os = "windows" } },
  { lib = "secur32", when = { os = "windows" } },
  { lib = "normaliz", when = { os = "windows", idn = true } },
  { lib = "icucore", when = { os = "macos", idn = true } },
  { lib = "iconv", when = { os = "macos", idn = true } },
]

[package.upstream]
url = "https://github.com/curl/curl.git"
commit = "8c908d2d0a6d32abdedda2c52e90bd56ec76c24d"

[package.publish]
include = [
  { from = "include/curl/*.h", to = "curl" },
]
define = ["CURL_STATICLIB"]

[deps.package]
mbedtls = { version = "3.6.7", when = { tls = true, os = { not = "windows" } } }

[options.tls]
type = "bool"
default = true

[options.idn]
type = "bool"
default = false

[options.ftp]
type = "bool"
default = true

[options.file]
type = "bool"
default = true

[options.dict]
type = "bool"
default = true

[options.gopher]
type = "bool"
default = true

[options.imap]
type = "bool"
default = true

[options.pop3]
type = "bool"
default = true

[options.smtp]
type = "bool"
default = true

[options.telnet]
type = "bool"
default = true

[options.tftp]
type = "bool"
default = true

[options.mqtt]
type = "bool"
default = true

[options.rtsp]
type = "bool"
default = true

[options.smb]
type = "bool"
default = true

[options.ipfs]
type = "bool"
default = true

[options.websockets]
type = "bool"
default = true

[options.proxy]
type = "bool"
default = true

[options.cookies]
type = "bool"
default = true

[options.doh]
type = "bool"
default = true

[options.hsts]
type = "bool"
default = true

[options.altsvc]
type = "bool"
default = true

[options.netrc]
type = "bool"
default = true

[options.mime]
type = "bool"
default = true

[options.verbose_strings]
type = "bool"
default = true

[[lib]]
name = "curl"
kinds = ["static"]
include = ["lib", { path = "config", tree = "manifest" }]
define = [
  "BUILDING_LIBCURL",
  "HAVE_CONFIG_H",
  { value = "_GNU_SOURCE", when = { os = "linux" } },
]
source = [
  "lib/*.c",
  "lib/curlx/*.c",
  "lib/vauth/*.c",
  "lib/vtls/*.c",
  "lib/vquic/*.c",
  "lib/vssh/*.c",
]
system_deps = [
  { framework = "SystemConfiguration" },
  { framework = "CoreFoundation" },
]

[[bin]]
name = "curl"
include = ["lib", "src", { path = "config", tree = "manifest" }]
define = [
  "HAVE_CONFIG_H",
  { value = "_GNU_SOURCE", when = { os = "linux" } },
]
source = [
  "src/tool_*.c",
  "src/config2setopts.c",
  "src/slist_wc.c",
  "src/terminal.c",
  "src/var.c",
  "src/toolx/tool_time.c",
]
deps = ["curl"]

[[example]]
name = "get"
source = [{ path = "example/get.c", tree = "manifest" }]
deps = ["curl"]
