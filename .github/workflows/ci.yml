name: ci

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SPN_STORAGE_DIR: ${{ github.workspace }}/.cache/spn
  SELFHOST_EPOCH: 2

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.plan.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'bootstrap') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bootstrap=false
          if [ "$EVENT" != "pull_request" ] || [ "$LABELED" = "true" ]; then
            bootstrap=true
          else
            changed="$(git diff --name-only "$BASE...$HEAD")"
            if grep -Eq '^(include/|source/core/codegen/schema/abi\.json$)' <<< "$changed"; then
              bootstrap=true
            fi
          fi
          echo "bootstrap=$bootstrap"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"

  build:
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: x86_64-linux, os: ubuntu-latest, bin: .build/store/x86_64-linux-gnu/bin/spn }
          - { id: aarch64-macos, os: macos-latest, bin: .build/store/aarch64-macos-none/bin/spn }
          - { id: x86_64-windows, os: windows-latest, bin: .build/store/x86_64-windows-msvc/bin/spn.exe }
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SPN_STAGE0: ${{ github.workspace }}/${{ matrix.bin }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        id: state
        with:
          path: |
            .cache
            build
          key: selfhost-e${{ env.SELFHOST_EPOCH }}-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: selfhost-e${{ env.SELFHOST_EPOCH }}-${{ matrix.id }}-
      - uses: actions/cache/restore@v4
        id: driver
        if: needs.plan.outputs.bootstrap != 'true'
        with:
          path: ${{ matrix.bin }}
          key: driver-${{ matrix.id }}-${{ github.event.pull_request.base.sha }}
          restore-keys: driver-${{ matrix.id }}-

      - run: make ci
        if: needs.plan.outputs.bootstrap == 'true' || steps.driver.outputs.cache-matched-key == ''

      - run: tools/devenv.ps1
        if: runner.os == 'Windows'
        shell: pwsh

      - run: make ci-selfhost

      - uses: actions/cache/save@v4
        with:
          path: |
            .cache
            build
          key: ${{ steps.state.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: ${{ matrix.bin }}
          key: driver-${{ matrix.id }}-${{ github.sha }}

  package:
    if: ${{ needs.plan.outputs.bootstrap == 'true' }}
    needs: [plan, build]
    uses: ./.github/workflows/package.yml
    with:
      channel: canary

  canary:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum spn-* > SHASUMS256.txt
      - run: |
          chmod +x dist/installer_render
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' spn.toml)"
          dist/installer_render dist/SHASUMS256.txt tools/install dist "${version}" canary ${{ github.repository }}
      - run: gh release upload canary dist/spn-* dist/SHASUMS256.txt dist/install.sh dist/install.ps1 --clobber --repo ${{ github.repository }}

  ci:
    name: ci
    if: ${{ !cancelled() }}
    needs: [plan, build, package, canary]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJson(needs) }}
        run: jq --exit-status '(.build.result == "success") and (.package.result == "success" or (.package.result == "skipped" and .plan.outputs.bootstrap != "true")) and (.canary.result == "success" or .canary.result == "skipped")' <<< "$NEEDS"
