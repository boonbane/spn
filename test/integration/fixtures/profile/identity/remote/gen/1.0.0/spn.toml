[package]
name = "gen"
version = "1.0.0"

[package.configure]
source = ["tools/configure.c"]

[package.build]
source = ["tools/build.c"]

[[lib]]
name = "gen"
kinds = ["static"]
source = ["gen.c"]
define = [
  { value = "EXPECT_GEN=2", when = { opt = "2" } },
  { value = "EXPECT_GEN=3", when = { sanitize_address = true } },
]
