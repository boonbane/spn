[package]
name = "kit"
version = "1.0.0"

[package.publish]
include = [
  { from = "kit.h" },
  { from = "sub/*", to = "kit" },
  { from = "deep/**", to = "kit/deep" },
  { from = "kit.h", to = "lit" },
  { from = "on.h", to = "kit", when = { mode = "debug" } },
  { from = "off.h", to = "kit", when = { mode = "release" } },
]

[[lib]]
name = "kit"
kinds = ["source"]
