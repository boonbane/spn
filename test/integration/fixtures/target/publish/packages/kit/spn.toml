[package]
name = "kit"
version = "1.0.0"

[package.publish]
include = [
  { from = "source/kit.h" },
  { from = "source/sub/*", to = "kit" },
  { from = "source/deep/**", to = "kit/deep" },
  { from = "source/kit.h", to = "lit" },
  { from = "source/on.h", to = "kit", when = { mode = "debug" } },
  { from = "source/off.h", to = "kit", when = { mode = "release" } },
]

[[lib]]
name = "kit"
kinds = ["source"]
