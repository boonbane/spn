[package]
name = "A"
version = "0.1.0"

[package.upstream]
url = "@A.url@"
commit = "@A.commit@"

[package.publish]
include = [{ from = "manifest/pub.h" }]

[[lib]]
name = "A"
kinds = ["static"]
source = ["a.c"]
publish.include = [{ from = "source/a.h" }, { from = "manifest/cfg.h" }]

[[example]]
name = "E"
source = ["example/e.c"]
deps = ["A"]

[[example]]
name = "R"
source = [{ path = "example/r.c", tree = "manifest" }]
deps = ["A"]

[[example]]
name = "G"
source = [{ path = "example/g/*.c", tree = "manifest" }]

[[example]]
name = "X"
source = ["manifest/example/x/x.c", { path = "example/x/x.c", tree = "manifest" }, { path = "example/x/main.c", tree = "manifest" }]
