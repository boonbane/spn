[package]
name = "test"
version = "0.1.0"

[deps.package]
spum = { path = "packages/spum" }

[[toolchain]]
name = "custom"
compiler = "cc"
archiver = "ar"
driver = "gcc"
cxx = "c++"

[profile.default]
toolchain = "custom"
libc = { value = "shared", when = { os = "linux" } }

[[bin]]
name = "main"
source = ["main.c"]
