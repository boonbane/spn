[[toolchain]]
name = "A"
version = "1.0.0"
driver = "clang"
compiler = "A cc"
archiver = "A ar"
cxx = "A c++"
linker = "lld"
link_args = ["-fuse-ld=lld"]
mirrors = "https://example.com/mirrors.txt"
mirror_snapshot = '''
https://A.example.com
https://B.example.com
'''
host = { x86_64-linux = { url = "https://example.com/linux.tar.xz", sha256 = "aa" }, aarch64-macos = { url = "https://example.com/macos.tar.xz", sha256 = "bb" } }
target = [
  { arch = "wasm32", os = "wasi" },
  { arch = "x86_64", os = "linux", abi = "musl" }
]
