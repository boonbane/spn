[package]
name = "p"
version = "1.0.0"

[profile.release]
toolchain = "zig"
static_deps = true
standard = "c99"
mode = "release"
opt = "3"
strip = "symbols"
sanitize = ["address", "undefined"]
emit = ["static", "shared"]
os = "linux"
arch = "x86_64"
abi = "gnu"

[profile.clean]
sanitize = []
emit = []
static_deps = false
