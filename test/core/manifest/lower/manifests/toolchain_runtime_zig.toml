[package]
name = "p"
version = "1.0.0"

[[toolchain]]
name = "T"
compiler = "zig cc"
archiver = "zig ar"
driver = "zig"
target = [
  { arch = "aarch64", os = "macos",   abi = "apple" },
  { arch = "x86_64",  os = "windows", abi = "msvc" },
  { arch = "aarch64", os = "windows", abi = "msvc", runtime = { supported = ["static", "shared"] } },
]
