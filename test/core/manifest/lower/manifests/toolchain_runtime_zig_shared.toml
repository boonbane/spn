[package]
name = "p"
version = "1.0.0"

[[toolchain]]
name = "T"
compiler = "zig cc"
archiver = "zig ar"
driver = "zig"
target = [
  { arch = "x86_64", os = "linux", abi = "gnu", runtime = { supported = ["static", "shared"] } },
  { arch = "x86_64", os = "windows", abi = "msvc", runtime = { supported = ["static", "shared"] } },
  { arch = "x86_64", os = "windows", abi = "gnu", runtime = { supported = ["static", "shared"] } },
]
