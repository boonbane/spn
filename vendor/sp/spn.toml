[package]
name = "sp"
version = "3.5.0"
author = "tspader"
maintainer = "tspader"
system_deps = [
  { lib = "m", when = { os = "linux" } },
]

[package.upstream]
url = "https://github.com/tspader/sp.git"
commit = "1042cdcf478ed2f00d6a600d3c01c518cd9136e7"

[[lib]]
name = "sp"
kinds = ["source"]

[package.publish]
include = [
  { from = "source/sp.h" },
  { from = "source/sp/*", to = "sp" },
]
